databases:
  - name: peakfinity-studio-db
    plan: basic-256mb
    databaseName: peakfinity_studio
    user: peakfinity

services:
  - type: web
    name: peakfinity-studio
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: peakfinity-studio-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: peakfinitylabs.com
      - key: FAL_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
